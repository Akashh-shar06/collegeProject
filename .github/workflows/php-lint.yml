name: PHP syntax checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -o pipefail
          find app config public tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l
